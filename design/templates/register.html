<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
  <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-bold mb-6 text-center text-teal-500">Create Account</h2>
    <form method="POST">
      {% csrf_token %}
      <input name="username" type="text" placeholder="Username" class="w-full mb-4 p-2 border rounded" required />
      <input name="email" type="email" placeholder="Email" class="w-full mb-4 p-2 border rounded" required />
      <input name="password1" type="password" placeholder="Password" class="w-full mb-4 p-2 border rounded" required />
      <input name="password2" type="password" placeholder="Confirm Password" class="w-full mb-4 p-2 border rounded" required />
      <button type="submit" class="w-full bg-teal-500 hover:bg-teal-600 text-white p-2 rounded">Register</button>
      <p class="text-sm mt-4 text-center">Already have an account? <a href="{% url 'login' %}" class="text-blue-500">Login</a></p>
    </form>
    {% for message in messages %}
      <p class="text-red-500 text-sm mt-2 text-center">{{ message }}</p>
    {% endfor %}
  </div>
</body>
</html>
