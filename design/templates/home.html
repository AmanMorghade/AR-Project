{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Virtual Home Designer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-gray-300 to-white min-h-screen bg-cover bg-no-repeat bg-center" style="background-image: url('{% static 'images/bg2.jpg' %}');">

  <!-- Navbar -->
  <nav class="w-full fixed top-0 z-10">
    <div class="max-w-7xl mx-auto py-3 flex justify-end items-center space-x-4">
      <a href="{% url 'login' %}" class="px-4 py-2 bg-white text-teal-500 rounded-lg hover:bg-teal-100 transition text-sm font-semibold">
        Sign In
      </a>
      <a href="{% url 'register' %}" class="px-4 py-2 bg-white text-teal-500 rounded-lg hover:bg-teal-100 transition text-sm font-semibold">
        Create Account
      </a>
    </div>
  </nav>

  <!-- Main Content -->
  <main id="mainContainer" class="flex items-center justify-center pt-40 pb-12 transition-all duration-500">
    <div class="w-full max-w-2xl bg-white rounded-3xl shadow-2xl p-8">
      <!-- Heading -->
      <h1 class="text-center text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-teal-400 via-cyan-500 to-blue-500 mb-6">
        🏡 Virtual Home Designer
      </h1>

      <!-- Upload Form -->
      <form action="{% url 'upload' %}" method="POST" enctype="multipart/form-data" class="space-y-6">
        {% csrf_token %}

        <!-- Drag & Drop Area -->
        <div id="drop-area" class="flex flex-col items-center justify-center border-2 border-dashed border-gray-300 rounded-xl p-6 bg-gray-50 hover:bg-gray-100 transition cursor-pointer">
          <svg class="w-12 h-12 text-blue-400 mb-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M7 16V4m0 0L3 8m4-4l4 4M17 8h2a2 2 0 012 2v10a2 2 0 01-2 2h-2M7 8h10" />
          </svg>
          <p class="text-gray-600">Drag & Drop your image here</p>
          <p class="text-gray-500 text-sm">or</p>
          <button type="button" id="uploadBtn" class="mt-3 px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600">
            Browse Files
          </button>
          <input type="file" id="fileInput" class="hidden" accept="image/*" name="image">
        </div>

        <!-- Image Preview -->
        <div id="previewContainer" class="hidden">
          <img id="previewImage" class="rounded-lg shadow-md h-48 w-auto mx-auto">
          <button type="button" id="removeBtn" class="mt-2 px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600">
            Remove
          </button>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="w-full px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 hidden">
          Upload Image
        </button>

        <!-- Upload Status -->
        <p id="uploadStatus" class="text-center text-green-600 mt-2 hidden">Image uploaded successfully!</p>
      </form>
    </div>
  </main>

  <!-- JavaScript -->
  <script>
    const fileInput = document.getElementById("fileInput");
    const uploadBtn = document.getElementById("uploadBtn");
    const dropArea = document.getElementById("drop-area");
    const previewContainer = document.getElementById("previewContainer");
    const previewImage = document.getElementById("previewImage");
    const removeBtn = document.getElementById("removeBtn");
    const submitBtn = document.getElementById("submitBtn");
    const mainContainer = document.getElementById("mainContainer");

    uploadBtn.addEventListener("click", () => fileInput.click());

    fileInput.addEventListener("change", (e) => handleFileUpload(e.target.files[0]));

    dropArea.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropArea.classList.add("bg-gray-200");
    });

    dropArea.addEventListener("dragleave", () => {
      dropArea.classList.remove("bg-gray-200");
    });

    dropArea.addEventListener("drop", (e) => {
      e.preventDefault();
      dropArea.classList.remove("bg-gray-200");
      handleFileUpload(e.dataTransfer.files[0]);
    });

    function handleFileUpload(file) {
      if (file && file.type.startsWith("image/")) {
        const reader = new FileReader();
        reader.onload = (e) => {
          previewImage.src = e.target.result;
          previewContainer.classList.remove("hidden");
          submitBtn.classList.remove("hidden");

          // Move container up
          mainContainer.classList.remove("pt-40");
          mainContainer.classList.add("pt-10");
        };
        reader.readAsDataURL(file);
      }
    }

    removeBtn.addEventListener("click", () => {
      previewContainer.classList.add("hidden");
      submitBtn.classList.add("hidden");
      fileInput.value = "";

      // Reset container spacing
      mainContainer.classList.remove("pt-10");
      mainContainer.classList.add("pt-40");
    });
  </script>

</body>
</html>
